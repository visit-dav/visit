# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -r src/doc/requirements.txt
    - sphinx-build -b html src/doc $READTHEDOCS_OUTPUT/html
    - python -m pagefind  --include-characters "_-./:+#<>" --exclude-selectors "a.headerlink" --site $READTHEDOCS_OUTPUT/html

# Build documentation in the doc/ directory with Sphinx
sphinx:
  configuration: src/doc/conf.py
  fail_on_warning: true

formats: all

python:
  install:
    - requirements: src/doc/requirements.txt
